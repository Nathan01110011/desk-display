name: Validate shared app headers
on:
  push:
    branches: [fix/shared-header-back-buttons]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
