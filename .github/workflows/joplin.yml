name: Joplin checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/joplin*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/joplin.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:joplin
      - run: pnpm build
