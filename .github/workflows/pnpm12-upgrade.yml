name: Validate pnpm 12 and refresh dependencies

on:
  push:
    branches:
      - chore/pnpm-12-18-dependencies

permissions:
  contents: write

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.18.0
      - name: Refresh pnpm lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Upgrade dependencies within declared version ranges
        run: pnpm update --depth 0
      - name: Validate reproducible install
        run: pnpm install --frozen-lockfile
      - name: Validate app
        run: pnpm build
      - name: Commit validated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh lockfile and compatible dependency versions"
            git push origin HEAD:chore/pnpm-12-18-dependencies
          fi
